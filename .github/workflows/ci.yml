name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Unit tests (no database)
        run: go test -short ./...

  integration:
    name: Integration (embedded PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache embedded PostgreSQL downloads
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Full suite (bootstrap gate, scenario matrix, extract round trip, refactorlog, drift)
        run: go test -p 1 -timeout 30m ./...

  frontend:
    name: GUI (type-check, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Tauri supervisor (fmt, clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - run: cargo fmt --manifest-path ui/src-tauri/Cargo.toml --check
      - name: Placeholder sidecar (externalBin must exist for the build script)
        run: |
          mkdir -p ui/src-tauri/binaries
          printf '#!/bin/sh\n' > ui/src-tauri/binaries/pg-dac-x86_64-unknown-linux-gnu
          chmod +x ui/src-tauri/binaries/pg-dac-x86_64-unknown-linux-gnu
      - run: cargo clippy --manifest-path ui/src-tauri/Cargo.toml --all-targets -- -D warnings
