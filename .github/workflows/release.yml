name: Release

# A pushed v* tag builds everything and creates a draft release; publishing
# the draft ships it. "Run workflow" (workflow_dispatch) is a dry run of the
# same build from any branch: installers, update signatures and CLI binaries
# come out as workflow artifacts and no release is created, so a change to the
# build can be tried before a tag depends on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Tag matches the pinned version; updates are configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          PIN=$(tr -d ' \n\r' < ui/PGDAC_VERSION)
          # A dry run has no tag; everything else is checked the same way.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG=${GITHUB_REF_NAME#v}
            if [ "$PIN" != "$TAG" ]; then
              echo "tag v$TAG does not match ui/PGDAC_VERSION ($PIN)"; exit 1
            fi
          fi
          # The updater compares the app version (tauri.conf.json) with the
          # release manifest, so every version field must be the pinned one.
          # `pnpm release <version>` in ui/ sets them all.
          for f in ui/package.json ui/src-tauri/tauri.conf.json; do
            V=$(jq -r .version "$f")
            if [ "$V" != "$PIN" ]; then echo "$f has version $V, expected $PIN"; exit 1; fi
          done
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' ui/src-tauri/Cargo.toml | head -1)
          if [ "$V" != "$PIN" ]; then echo "ui/src-tauri/Cargo.toml has version $V, expected $PIN"; exit 1; fi
          echo "version=$PIN" >> "$GITHUB_OUTPUT"
      - name: Updater public key is set
        run: |
          # An app shipped without the key could never update itself; see docs/UPDATES.md.
          KEY=$(jq -r '.plugins.updater.pubkey // ""' ui/src-tauri/tauri.conf.json)
          if [ -z "$KEY" ]; then
            echo "plugins.updater.pubkey in ui/src-tauri/tauri.conf.json is empty (docs/UPDATES.md, one-time setup)"; exit 1
          fi

  # The CLI is pure Go (CGO off), so every target cross-compiles on Linux:
  # no job waits for a scarce macOS or Windows runner just to run go build.
  cli:
    name: CLI / sidecar (${{ matrix.triple }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - goos: linux
            goarch: arm64
            triple: aarch64-unknown-linux-gnu
            ext: ""
          - goos: windows
            goarch: amd64
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
          - goos: darwin
            goarch: arm64
            triple: aarch64-apple-darwin
            ext: ""
          - goos: darwin
            goarch: amd64
            triple: x86_64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o "dist/pg-dac-${{ matrix.triple }}${{ matrix.ext }}" ./cmd/pg-dac
      - uses: actions/upload-artifact@v7
        with:
          name: pg-dac-${{ matrix.triple }}
          path: dist/*

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: [version, cli]
    # A build takes 5-9 minutes; a job stuck waiting for a runner fails here
    # instead of after GitHub's own limit, and only it needs re-running.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Sidecar for this platform
        uses: actions/download-artifact@v8
        with:
          name: pg-dac-${{ matrix.triple }}
          path: ui/src-tauri/binaries
      - name: Make the sidecar executable
        if: runner.os != 'Windows'
        run: chmod +x ui/src-tauri/binaries/pg-dac-${{ matrix.triple }}
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      # Builds the installers, signs each with the updater key and uploads them
      # with `latest.json`, the manifest running apps check (docs/UPDATES.md).
      # The release stays a draft: running apps see it only once it is
      # published, so publishing the draft is what ships the update.
      - name: Build, sign and upload to the draft release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "pg-dac ${{ github.ref_name }}"
          releaseBody: "pg-dac ${{ needs.version.outputs.version }} — CLI binaries and desktop installers. See CHANGELOG.md for what changed."
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      # The dry run: the same build and signatures, kept as workflow artifacts.
      - name: Build and sign (dry run, no release)
        if: github.event_name != 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          args: --config src-tauri/tauri.release.conf.json
      - name: Keep the dry-run installers
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.triple }}
          path: ui/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

  cli-assets:
    name: Attach CLI binaries to the release
    needs: [version, cli, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pg-dac-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
