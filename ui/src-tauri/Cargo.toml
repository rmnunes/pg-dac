[package]
name = "pg-dac-ui"
version = "0.9.6"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pg_dac_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rand = "0.8"
tauri-plugin-updater = "2"
# Saved passwords live in the OS credential store: Windows Credential Manager,
# the macOS Keychain, or the Secret Service on Linux (pure-Rust D-Bus and
# crypto, so building needs no libdbus or OpenSSL headers).
keyring = { version = "3.6", features = ["windows-native", "apple-native", "async-secret-service", "tokio", "crypto-rust"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
